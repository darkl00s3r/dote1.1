# --- PARAMÈTRES GÉNÉRAUX ---
general {
    grace = 0
    disable_loading_bar = false
    hide_cursor = false
    no_fade_in = false
}

# --- ARRIÉRURE-PLAN (Background) ---
background {
    monitor = 
    path = /home/bleu/Pictures/Wallpapers/wallhaven-3qrdr6.jpg # Ou screenshot
    color = rgba(17, 17, 17, 1.0)

    blur_passes = 2      # Nombre de passes de flou (0 pour désactiver)
    blur_size = 7          # Taille du flou
    noise = 0.0117         # Bruit visuel
    contrast = 0.8916      # Contraste
    brightness = 0.8172    # Luminosité
    vibrancy = 0.1696      # Vibrance
}

# --- CHAMP DE MOT DE PASSE (Input Field) ---
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.23       # Taille des points du mot de passe
    dots_spacing = 0.15    # Espacement des points
    dots_center = true
    outer_color = rgba(33, cc, ff, 1.0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = true
    placeholder_text = <i>Password</i>
    hide_input = false
    position = 0, -50
    halign = center
    valign = center
}

# --- LABEL (Ex: Heure) ---
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +'%H:%M') </big></b>"
    color = rgb(240, 240, 240)
    font_size = 200
    font_family = JetBrainsMono Nerd Font
    position = 0, 250
    halign = center
    valign = center
}

# --- IMAGE (Ex: Avatar utilisateur) ---
image {
    monitor =
    path = /home/bleu/Pictures/PXL_20260818_082310409.PORTRAIT.jpg
    size = 120
    rounding = 1          # Négatif pour un cercle
    border_size = 2
    border_color = rgba(221, 221, 221, 1.0)
    position = 0, 150
    halign = center
    valign = center
}
